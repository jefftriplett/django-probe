{% extends "base.html" %}
{% block title %}Rename {{ project.name }} | Django Probe{% endblock %}

{% block content %}
<header class="page-header">
  <h1>Rename {{ project.name }}</h1>
</header>

<div class="panel panel--subtle auth-panel">
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <p class="muted">
      Prefer not to use an identifying name?
      <a href="{% url 'project-edit' organization_id=organization.pk project_id=project.pk %}?suggest=1">Generate a codename.</a>
    </p>
    <button type="submit">Save</button>
  </form>
</div>

<p class="back-link"><a href="{% url 'project-detail' organization_id=organization.pk project_id=project.pk %}">&larr; Back to {{ project.name }}</a></p>
{% endblock %}
